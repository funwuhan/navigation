<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一心的宇宙导航</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://ai.storyverse.cn/favicon.ico">
</head>
<body>
    <div class="container">
        <!-- 搜索框区域 -->
        <div class="search-container">
            <div class="search-box">
                <form action="https://www.google.com/search" method="get" target="_blank">
                    <input type="text" name="q" placeholder="Google搜索..." autocomplete="off">
                    <button type="submit">搜索</button>
                </form>
            </div>
            <div class="search-box">
                <form action="https://www.baidu.com/s" method="get" target="_blank">
                    <input type="text" name="wd" placeholder="百度搜索..." autocomplete="off">
                    <button type="submit">搜索</button>
                </form>
            </div>
        </div>

        <!-- 快捷链接区域 -->
        <div class="links-container">
            <div class="links-header">
                <h2>一心的宇宙导航</h2>
            </div>
            <div id="linksGrid" class="links-grid"></div>
            <button id="savePageBtn" class="save-button">生成静态导航页面</button>
        </div>
        
        <footer>
            <p>© 2023 一心的宇宙导航 - 简单、高效的个人导航工具</p>
        </footer>
    </div>

    <!-- 添加链接的模态框 -->
    <div id="addLinkModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>添加新链接</h3>
            <form id="addLinkForm">
                <div class="form-group">
                    <label for="linkTitle">标题：</label>
                    <input type="text" id="linkTitle" required>
                </div>
                <div class="form-group">
                    <label for="linkUrl">URL：</label>
                    <input type="text" id="linkUrl" required placeholder="输入网址，将自动添加 https://">
                </div>
                <div class="form-group">
                    <label for="linkIcon">图标URL（可选）：</label>
                    <input type="url" id="linkIcon" placeholder="留空将自动获取网站图标">
                </div>
                <button type="submit">保存</button>
            </form>
        </div>
    </div>
    
    <!-- 编辑链接的模态框 -->
    <div id="editLinkModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>编辑链接</h3>
            <form id="editLinkForm">
                <input type="hidden" id="editLinkIndex">
                <div class="form-group">
                    <label for="editLinkTitle">标题：</label>
                    <input type="text" id="editLinkTitle" required>
                </div>
                <div class="form-group">
                    <label for="editLinkUrl">URL：</label>
                    <input type="text" id="editLinkUrl" required>
                </div>
                <div class="form-group">
                    <label for="editLinkIcon">图标URL（可选）：</label>
                    <input type="url" id="editLinkIcon" placeholder="留空将自动获取网站图标">
                </div>
                <button type="submit">保存修改</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
